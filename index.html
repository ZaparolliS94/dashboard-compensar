<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Projeto Compensar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:2rem 1rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem}
.logo{font-size:20px;font-weight:500}.logo span{color:#0F6E56}
.btn{padding:8px 16px;border-radius:8px;border:0.5px solid #d0d0cc;background:white;color:#1a1a1a;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn:hover{background:#f0f0ee}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-dl{background:#E1F5EE;color:#085041;border-color:#5DCAA5;text-decoration:none}
.btn-dl:hover{background:#9FE1CB}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
.metric{background:#ebebeb;border-radius:8px;padding:1rem}
.metric-label{font-size:12px;color:#666;margin-bottom:6px}
.metric-value{font-size:26px;font-weight:500}
.metric-value.green{color:#0F6E56}
.metric-sub{font-size:11px;color:#888;margin-top:4px}
.prog-bar{height:5px;background:#d0d0cc;border-radius:3px;overflow:hidden;margin-top:8px}
.prog-fill{height:100%;border-radius:3px;background:#0F6E56;transition:width .6s}
.section-title{font-size:14px;font-weight:500;margin-bottom:12px}
.locations{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1.5rem}
.loc-card{background:white;border:0.5px solid #e0e0dc;border-radius:12px;padding:1rem}
.loc-name{font-size:13px;font-weight:500;margin-bottom:3px}
.loc-count{font-size:12px;color:#888;margin-bottom:10px}
.loc-pct{font-size:22px;font-weight:500;margin-top:6px}
.loc-pct span{font-size:12px;font-weight:400;color:#888}
.table-card{background:white;border:0.5px solid #e0e0dc;border-radius:12px;overflow:hidden;margin-bottom:1.5rem}
.table-top{padding:12px 1rem;border-bottom:0.5px solid #e0e0dc;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.filters{display:flex;gap:6px}
.fbtn{font-size:12px;padding:4px 10px;border-radius:8px;border:0.5px solid #d0d0cc;background:transparent;color:#666;cursor:pointer}
.fbtn.active{background:#E1F5EE;color:#085041;border-color:#5DCAA5}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:8px;color:#888;pointer-events:none}
.search-wrap input{padding:5px 8px 5px 28px;font-size:12px;border:0.5px solid #d0d0cc;border-radius:8px;background:white;color:#1a1a1a;width:160px;outline:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;font-weight:500;color:#888;font-size:11px;border-bottom:0.5px solid #e0e0dc;background:#f8f8f6;text-transform:uppercase;letter-spacing:.4px}
td{padding:10px 12px;border-bottom:0.5px solid #f0f0ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500}
.badge-ok{background:#E1F5EE;color:#085041}
.badge-pend{background:#f0f0ee;color:#666}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:12px;color:#888;font-size:14px}
.spinner{width:28px;height:28px;border:2px solid #e0e0dc;border-top-color:#0F6E56;border-radius:50%;animation:spin .7s linear infinite}
.erro{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;color:#888;font-size:14px;text-align:center;padding:2rem}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none}
.btn-dl{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:6px;background:#E1F5EE;color:#085041;border:0.5px solid #5DCAA5;text-decoration:none;font-weight:500}
.btn-dl:hover{background:#9FE1CB}
.col-placa{width:95px}.col-local{width:105px}.col-marca{width:90px}.col-modelo{}.col-ano{width:55px}.col-status{width:100px}.col-laudo{width:75px}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <span>Carregando dados...</span>
</div>

<div id="erro" class="erro hidden">
  <div style="font-size:40px">⚠️</div>
  <div id="erro-msg"></div>
  <button class="btn" onclick="init()">Tentar novamente</button>
</div>

<div id="app" class="app hidden">
  <div class="header">
    <div>
      <div class="logo">Projeto <span>Compensar</span></div>
      <div style="font-size:12px;color:#888;margin-top:3px" id="updated-at"></div>
    </div>
    <button class="btn btn-sm" onclick="init()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Atualizar
    </button>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Total de veículos</div>
      <div class="metric-value" id="m-total">—</div>
      <div class="metric-sub">na carteira</div>
    </div>
    <div class="metric">
      <div class="metric-label">Laudos concluídos</div>
      <div class="metric-value green" id="m-ok">—</div>
      <div class="metric-sub">com OK</div>
    </div>
    <div class="metric">
      <div class="metric-label">Pendentes</div>
      <div class="metric-value" id="m-pend">—</div>
      <div class="metric-sub">aguardando</div>
    </div>
    <div class="metric">
      <div class="metric-label">Progresso geral</div>
      <div class="metric-value" id="m-pct">—</div>
      <div class="metric-sub">
        <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="section-title">Progresso por localização</div>
  <div class="locations" id="locations"></div>

  <div class="table-card">
    <div class="table-top">
      <div class="section-title" style="margin:0">Veículos</div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <div class="filters">
          <button class="fbtn active" onclick="setFiltro('todos',this)">Todos</button>
          <button class="fbtn" onclick="setFiltro('ok',this)">Concluídos</button>
          <button class="fbtn" onclick="setFiltro('pendente',this)">Pendentes</button>
        </div>
        <div class="search-wrap">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Buscar placa / local..." oninput="setBusca(this.value)">
        </div>
      </div>
    </div>

    <div id="barra-selecao" style="display:none;padding:10px 1rem;background:#E1F5EE;border-bottom:0.5px solid #5DCAA5;display:none;align-items:center;justify-content:space-between">
      <span id="sel-count" style="font-size:13px;color:#085041;font-weight:500">0 selecionados</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm" onclick="limparSelecao()">Limpar</button>
        <button class="btn btn-sm" style="background:#0F6E56;color:white;border-color:#0F6E56" onclick="downloadSelecionados()">
          ↓ Baixar selecionados
        </button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="check-all" onchange="toggleTodos(this)" title="Selecionar todos"></th>
          <th class="col-placa">Placa</th>
          <th class="col-local">Local</th>
          <th class="col-marca">Marca</th>
          <th class="col-modelo">Modelo</th>
          <th class="col-ano">Ano</th>
          <th class="col-status">Status</th>
          <th class="col-laudo">Laudo</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const CSV_URL = 'https://raw.githubusercontent.com/ZaparolliS94/dashboard-compensar/main/Lista_principal.csv';

let veiculos = [], filtroAtivo = 'todos', busca = '';

async function init() {
  show('loading');
  try {
    const resp = await fetch(CSV_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('Erro ' + resp.status + ' ao carregar dados');
    const text = await resp.text();

    const result = Papa.parse(text, {
      separator: ';',
      encoding: 'UTF-8',
      skipEmptyLines: true,
      quoteChar: '"'
    });

    const rows = result.data;

    // Detectar índice da coluna Link Laudo no cabeçalho
    let linkIdx = 16;
    if (rows[2]) {
      const header = rows[2].map(c => c.trim().toLowerCase());
      const found = header.findIndex(c => c.includes('link'));
      if (found >= 0) linkIdx = found;
    }
    veiculos = [];

    for (let i = 3; i < rows.length; i++) {
      const r = rows[i];
      const placa = (r[2] || '').trim();
      if (!placa || placa.toLowerCase() === 'placa') continue;
      const statusRaw = (r[0] || '').trim().toUpperCase();
      const status = statusRaw === 'OK' ? 'ok' : 'pendente';
      const anoRaw = (r[11] || '').trim();
      const ano = anoRaw.includes('/') ? anoRaw.split('/').pop().trim() : anoRaw;
      const marca = (r[8] || '').trim();
      const modelo = (r[9] || '').trim();
      const link = (r[linkIdx] || '').trim();
      veiculos.push({
        placa,
        local: (r[3] || '').trim(),
        marca,
        modelo: marca + (modelo ? ' ' + modelo : ''),
        chassi: (r[10] || '').trim(),
        ano,
        status,
        link
      });
    }

    renderDashboard();
    document.getElementById('updated-at').textContent =
      'Atualizado em ' + new Date().toLocaleString('pt-BR');
    show('app');
  } catch(e) {
    document.getElementById('erro-msg').textContent = e.message;
    show('erro');
  }
}

function renderDashboard() {
  const total = veiculos.length;
  const ok = veiculos.filter(v => v.status === 'ok').length;
  const pend = total - ok;
  const pct = total ? Math.round(ok / total * 100) : 0;

  document.getElementById('m-total').textContent = total;
  document.getElementById('m-ok').textContent = ok;
  document.getElementById('m-pend').textContent = pend;
  document.getElementById('m-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  const locMap = {};
  veiculos.forEach(v => {
    if (!v.local) return;
    if (!locMap[v.local]) locMap[v.local] = { total: 0, ok: 0 };
    locMap[v.local].total++;
    if (v.status === 'ok') locMap[v.local].ok++;
  });

  document.getElementById('locations').innerHTML = Object.entries(locMap)
    .sort((a,b) => b[1].ok - a[1].ok)
    .map(([nome, d]) => {
      const p = d.total ? Math.round(d.ok / d.total * 100) : 0;
      return `<div class="loc-card">
        <div class="loc-name">${nome}</div>
        <div class="loc-count">${d.ok} de ${d.total} veículos</div>
        <div class="prog-bar"><div class="prog-fill" style="width:${p}%"></div></div>
        <div class="loc-pct">${p}% <span>concluído</span></div>
      </div>`;
    }).join('');

  renderTabela();
}

function renderTabela() {
  const lista = veiculos.filter(v => {
    const pf = filtroAtivo === 'todos' || v.status === filtroAtivo;
    const pb = !busca ||
      v.placa.toLowerCase().includes(busca.toLowerCase()) ||
      v.local.toLowerCase().includes(busca.toLowerCase()) ||
      v.modelo.toLowerCase().includes(busca.toLowerCase());
    return pf && pb;
  });

  document.getElementById('tbody').innerHTML = lista.length === 0
    ? `<tr><td colspan="8" style="text-align:center;color:#888;padding:2rem">Nenhum veículo encontrado</td></tr>`
    : lista.map(v => `
    <tr>
      <td style="text-align:center">${v.status === 'ok' && v.link
        ? `<input type="checkbox" class="chk-placa" data-placa="${v.placa}" data-link="${v.link}" onchange="atualizarSelecao()">`
        : ''
      }</td>
      <td style="font-weight:500">${v.placa}</td>
      <td style="color:#666">${v.local}</td>
      <td style="color:#666">${v.marca}</td>
      <td style="color:#666" title="${v.modelo}">${v.modelo}</td>
      <td style="color:#666">${v.ano || '—'}</td>
      <td><span class="badge ${v.status === 'ok' ? 'badge-ok' : 'badge-pend'}">
        ${v.status === 'ok' ? '✓ Concluído' : '● Pendente'}
      </span></td>
      <td>${v.status === 'ok' && v.link
        ? `<a href="${v.link}" target="_blank" class="btn-dl">↓ Baixar</a>`
        : v.status === 'ok'
          ? `<span style="color:#bbb;font-size:12px">Sem link</span>`
          : `<span style="color:#bbb;font-size:12px">—</span>`
      }</td>
    </tr>`).join('');

  atualizarSelecao();
}

function atualizarSelecao() {
  const checks = document.querySelectorAll('.chk-placa:checked');
  const barra = document.getElementById('barra-selecao');
  const count = checks.length;
  document.getElementById('sel-count').textContent = `${count} selecionado${count !== 1 ? 's' : ''}`;
  barra.style.display = count > 0 ? 'flex' : 'none';
}

function toggleTodos(cb) {
  document.querySelectorAll('.chk-placa').forEach(c => c.checked = cb.checked);
  atualizarSelecao();
}

function limparSelecao() {
  document.querySelectorAll('.chk-placa').forEach(c => c.checked = false);
  const ca = document.getElementById('check-all');
  if (ca) ca.checked = false;
  atualizarSelecao();
}

async function downloadSelecionados() {
  const checks = document.querySelectorAll('.chk-placa:checked');
  if (!checks.length) return;
  window.open('https://drive.google.com/drive/folders/1WU8nx02EvEMB54fdcOh_gMbJyTSHSHKK', '_blank');
}

function setFiltro(tipo, btn) {
  filtroAtivo = tipo;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTabela();
}

function setBusca(val) { busca = val; renderTabela(); }

function show(id) {
  ['loading','erro','app'].forEach(i => {
    document.getElementById(i).classList.toggle('hidden', i !== id);
  });
}

init();
</script>
</body>
</html>
